name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt for offscreen GUI tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
          python -m pip install PySide6==6.12.0
      - name: Python compile and unit tests
        run: |
          python -m compileall -q src
          python -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          bash -n install.sh install-user.sh uninstall.sh tools/*.sh
          for script in packaging/debian/*; do sh -n "$script"; done
      - name: Check sensitive files absent
        run: |
          ! find . -name 'monitor.json' -o -name 'profiles.json' -o -name 'killswitch.json' | grep .
      - name: Validate release metadata and website
        run: python tools/validate_release.py
      - name: Reproducible source archive
        run: |
          python tools/source_archive.py /tmp/release-a/ryoku-proxy-1.0.0.tar.gz
          python tools/source_archive.py /tmp/release-b/ryoku-proxy-1.0.0.tar.gz
          cmp /tmp/release-a/ryoku-proxy-1.0.0.tar.gz /tmp/release-b/ryoku-proxy-1.0.0.tar.gz
