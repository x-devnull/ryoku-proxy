name: Publish ED 1.0 release
on:
  push:
    tags: ['v1.0']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-v1.0
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
          python -m pip install PySide6==6.12.0
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh install-user.sh uninstall.sh packaging/PKGBUILD
  package:
    needs: validate
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed python git gnupg
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - run: RYOKU_REQUIRE_SIGNING_TEST=1 python -m unittest discover -s tests -p test_distribution.py -v
      - run: python tools/source_archive.py
      - name: Build native Arch package as unprivileged user
        run: |
          useradd -m builder
          chown -R builder:builder dist
          cd dist
          runuser -u builder -- makepkg --nodeps --nocheck --noconfirm
          sha256sum *.pkg.tar.zst > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: |
            dist/*.pkg.tar.zst
            dist/SHA256SUMS
  debian:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/build_deb.py
      - name: Inspect Debian archive
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/*.deb
  release:
    needs: [validate, package, debian]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/source_archive.py
      - uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: dist
      - name: Checksums for manual downloads
        run: |
          cd dist
          sha256sum *.pkg.tar.zst *.deb > SHA256SUMS
      - name: Publish release and attach sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0 >/dev/null 2>&1; then
            gh release edit v1.0 --title 'v1.0 — ED 1.0' --notes-file docs/RELEASE_NOTES.md --target main
            gh release upload v1.0 dist/ryoku-proxy-1.0.0-r2.tar.gz dist/ryoku-proxy-1.0.0-r2.tar.gz.sha256 dist/PKGBUILD dist/ryoku-proxy.install dist/*.pkg.tar.zst dist/*.deb dist/SHA256SUMS --clobber
          else
            gh release create v1.0 --verify-tag --title 'v1.0 — ED 1.0' --notes-file docs/RELEASE_NOTES.md dist/ryoku-proxy-1.0.0-r2.tar.gz dist/ryoku-proxy-1.0.0-r2.tar.gz.sha256 dist/PKGBUILD dist/ryoku-proxy.install dist/*.pkg.tar.zst dist/*.deb dist/SHA256SUMS
          fi
